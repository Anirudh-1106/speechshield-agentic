# Test Configuration
# Optimized for fast unit/integration tests

env: test
debug: false

audio:
  chunk_size: 256  # Very small for quick tests

asr:
  timeout_seconds: 120.0  # Generous timeout for CI/CD

toxicity:
  timeout_seconds: 30.0

rewrite:
  timeout_seconds: 30.0
  max_retries: 1

pipeline:
  latency_budget_ms: 5000.0  # Very relaxed for CI/CD environments
  graceful_shutdown_timeout: 3.0

logging:
  level: WARNING
  format: text
  enable_file_logging: false  # Don't clutter test output

dashboard:
  enabled: false  # Disable dashboard during tests
  refresh_interval: 10.0
