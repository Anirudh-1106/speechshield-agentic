name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_slow:
        description: "Also run slow tests (downloads ML models)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SPEECHSHIELD_ENV: test

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy types-PyYAML pydantic pyyaml
      - name: ruff
        run: ruff check --output-format=github .
      - name: CONFIG.md is up to date
        run: python scripts/gen_config_docs.py --check
      - name: mypy
        run: mypy agents core config main.py dashboard.py

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends portaudio19-dev ffmpeg
      - name: Python packages (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Fast tests with coverage gate
        run: pytest -m "not slow" -q --cov --cov-report=term --cov-report=xml --cov-fail-under=75
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  slow-tests:
    name: Slow tests (real models)
    if: github.event_name == 'workflow_dispatch' && inputs.run_slow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config/default.yaml') }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends portaudio19-dev ffmpeg
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - run: pytest -m slow -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: speechshield:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
