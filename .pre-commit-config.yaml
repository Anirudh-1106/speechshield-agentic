# Install once:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy agents core config main.py dashboard.py
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest-fast
        name: pytest (fast)
        entry: python -m pytest -m "not slow" -q -x
        language: system
        pass_filenames: false
        stages: [pre-push]
